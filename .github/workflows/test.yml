name: "Developer Workflow: Integration & Validation"

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Pull requests cancel their older runs; pushes to dev queue, so each commit is checked on its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Step 1: Compilation Check (Swift 6)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MIT Kerberos (Kerberos sign-in on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev krb5-user

      - name: Verify Swift toolchain
        run: swift --version

      - name: Build library
        run: swift build

      - name: Build tests
        run: swift build --build-tests

  unit-tests:
    name: "Step 2: Rapid Unit Tests (PostgresWire)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MIT Kerberos (Kerberos sign-in on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev krb5-user

      - name: Verify Swift toolchain
        run: swift --version

      - name: Run Unit Tests
        run: swift test --filter PostgresWireTests

  smoke-tests:
    name: "Step 3: Rapid Functional Validation (PG 17)"
    needs: build
    # Only run on pushes to dev or PRs to dev. Not on PRs to main (where matrix-tests run).
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MIT Kerberos (Kerberos sign-in on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev krb5-user

      - name: Verify Swift toolchain
        run: swift --version

      - name: Docker Preflight
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          docker info
          docker pull postgres:17

      - name: Bootstrap validated Postgres fixture
        env:
          USE_DOCKER: "1"
          POSTGRES_VERSION: "17"
          POSTGRES_PORT: "54321"
        run: |
          output=$(swift run --package-path . postgres-test-fixture)
          echo "$output"
          {
            echo "### Postgres fixture"
            echo ""
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Integration Tests
        env:
          USE_DOCKER: "1"
          POSTGRES_VERSION: "17"
          POSTGRES_PORT: "54321"
        run: swift test --filter PostgresKitTests

  tls-tests:
    name: "Step 3b: TLS against a server that requires it (PG 17)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MIT Kerberos (Kerberos sign-in on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev krb5-user

      - name: Start the TLS server (private CA, server and client certificates)
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          Tests/Fixtures/tls/start-server.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Run TLS tests
        run: swift test --filter TLSIntegrationTests

  kerberos-tests:
    name: "Step 3c: Kerberos sign-in against a KDC (PG 17)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MIT Kerberos (Kerberos sign-in on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev krb5-user

      - name: Start PostgreSQL with Kerberos and its KDC, and get a ticket for alice
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          Tests/Fixtures/kerberos/start-server.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Run Kerberos tests
        run: swift test --filter "KerberosIntegrationTests|GSSAuthenticationStateMachineTests"

  failover-tests:
    name: "Step 3d: Failover between two servers (PG 17)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MIT Kerberos (Kerberos sign-in on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev krb5-user

      - name: Start two PostgreSQL servers
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          Tests/Fixtures/failover/start-servers.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Run failover tests
        run: swift test --filter FailoverIntegrationTests

  matrix-tests:
    name: "Step 4: Compatibility - ${{ matrix.name }}"
    needs: build
    # Only run on Pull Requests to main or pushes to main.
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Active Release (PostgreSQL 14)"
            version: "14"
          - name: "Active Release (PostgreSQL 15)"
            version: "15"
          - name: "Active Release (PostgreSQL 16)"
            version: "16"
          - name: "Current Stable (PostgreSQL 17)"
            version: "17"
          - name: "Experimental (PostgreSQL 18)"
            version: "18"
          - name: "Rolling (PostgreSQL latest)"
            version: "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MIT Kerberos (Kerberos sign-in on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libkrb5-dev krb5-user

      - name: Verify Swift toolchain
        run: swift --version

      - name: Docker Preflight
        env:
          POSTGRES_VERSION: ${{ matrix.version }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          docker info
          docker pull "postgres:${POSTGRES_VERSION}"

      - name: Bootstrap validated Postgres fixture
        env:
          USE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}
          POSTGRES_PORT: "54321"
        run: |
          output=$(swift run --package-path . postgres-test-fixture)
          echo "$output"
          {
            echo "### Postgres fixture"
            echo ""
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Integration Tests
        env:
          USE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}
          POSTGRES_PORT: "54321"
        run: swift test --filter PostgresKitTests
